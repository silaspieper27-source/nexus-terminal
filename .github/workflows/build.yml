name: Build & Release

on:
  push:
      tags:
            - 'v*'
              workflow_dispatch:

              jobs:
                build:
                    runs-on: windows-latest
                        steps:
                              - uses: actions/checkout@v4
                                    - uses: actions/setup-node@v4
                                            with:
                                                      node-version: 18
                                                            - run: npm install
                                                                  - run: npx electron-builder --win --publish=never
                                                                        - uses: softprops/action-gh-release@v2
                                                                                with:
                                                                                          files: dist/*.exe
                                                                                                  env:
                                                                                                            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
